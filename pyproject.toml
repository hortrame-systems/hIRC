[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hirc-local"
version = "0.1.0.dev0"
description = "Local-first evidence-linked work and recovery core"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hirc = "hirc.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
